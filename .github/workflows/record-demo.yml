name: Record terminal demo
on:
  workflow_dispatch:
  push:
    branches: [docs/record-terminal-demo]
    paths:
      - '.github/workflows/record-demo.yml'
      - 'docs/material-you/record-demo.py'
permissions:
  contents: write
concurrency:
  group: record-terminal-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install virtual display and recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox ffmpeg fonts-dejavu-core
      - name: Build the fork and software rendering driver
        run: |
          nix build .#kitty-material-you-no-tests --out-link result-demo
          nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.mesa.drivers' --out-link result-mesa
          nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.libglvnd' --out-link result-gl
      - name: Record real Kitty on a virtual screen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1000x620x24 +extension GLX" python3 docs/material-you/record-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: kitty-material-you-demo
          path: |
            docs/material-you/demo.gif
            docs/material-you/demo.mp4
          if-no-files-found: error
      - name: Add successful recording to README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          if "](docs/material-you/demo.gif)" not in text:
              marker = "![Тёмная тема:"
              index = text.index(marker)
              demo = (
                  "## Демонстрация\n\n"
                  "Запись настоящего Kitty Material You: пружинный след курсора, "
                  "вкладки-таблетки и плавный переход между тёмной и светлой палитрами.\n\n"
                  "![Демонстрация Kitty Material You](docs/material-you/demo.gif)\n\n"
                  "[Видео MP4](docs/material-you/demo.mp4) · "
                  "[Повторить запись в облаке](../../actions/workflows/record-demo.yml)\n\n"
              )
              p.write_text(text[:index] + demo + text[index:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/material-you/demo.gif docs/material-you/demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "docs: add recorded Kitty Material You demonstration"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
